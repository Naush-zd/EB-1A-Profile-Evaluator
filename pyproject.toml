[project]
name = "eb1a-profile-evaluator"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "pypdf>=5,<7",
]

[project.scripts]
eb1a = "eb1a.cli:main"

[project.optional-dependencies]
bedrock = ["boto3>=1.35,<2"]
ui = ["streamlit>=1.40,<2"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.9,<1"]
embeddings = ["sentence-transformers>=3.0,<6"]

[tool.pytest.ini_options]
pythonpath = ["src"]
